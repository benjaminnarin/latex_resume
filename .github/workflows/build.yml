name: Build resume

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    container: texlive/texlive:latest
    steps:
      - uses: actions/checkout@v7
      - name: Compile
        run: |
          latexmk resume.tex
          cp resume.pdf Benjamin_Narin_Resume.pdf
      - uses: actions/upload-artifact@v7
        with:
          name: resume
          path: Benjamin_Narin_Resume.pdf
      # Pushing a tag like v2026.10 publishes the PDF as a GitHub Release.
      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          files: Benjamin_Narin_Resume.pdf

  # Every push to main replaces the "latest" prerelease, giving a stable link:
  # https://github.com/<owner>/<repo>/releases/download/latest/Benjamin_Narin_Resume.pdf
  latest:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency: latest-release
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: resume
      - name: Publish rolling release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release delete latest --cleanup-tag --yes || true
          gh release create latest Benjamin_Narin_Resume.pdf \
            --target "$GITHUB_SHA" --prerelease \
            --title "Latest build" \
            --notes "Built from $GITHUB_SHA. Tagged releases (v*) are the versioned snapshots."
