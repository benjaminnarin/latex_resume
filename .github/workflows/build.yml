name: Build resume

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    container: texlive/texlive:latest
    steps:
      - uses: actions/checkout@v7
      - name: Compile
        run: |
          latexmk resume.tex
          cp resume.pdf Benjamin_Narin_Resume.pdf
      - uses: actions/upload-artifact@v7
        with:
          name: resume
          path: Benjamin_Narin_Resume.pdf
      # Pushing a tag like v2026.10 publishes the PDF as a GitHub Release.
      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          files: Benjamin_Narin_Resume.pdf
